spring.application.name=reassignment-engine
spring.datasource.url=jdbc:h2:mem:ziprun
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.config.import=optional:file:./application-secret.properties

llm.provider=gemini
llm.api-key=${llm.api-key:undefined}
llm.model=gemini-3.6-flash
llm.base-url=https://generativelanguage.googleapis.com
